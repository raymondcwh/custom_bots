<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Anniversary!</title>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* Kuromi & Baku Color Palette */
        :root {
            --bg-dark: #120e17; /* Very dark purple/black */
            --kuromi-pink: #ff66b2;
            --baku-purple: #9b59b6;
            --card-bg: rgba(30, 25, 40, 0.85);
            --text-light: #f8f8ff;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            /* A subtle repeating pattern can go here. For now, a dark gradient */
            background-image: linear-gradient(135deg, #120e17 0%, #2a1a3a 100%);
            color: var(--text-light);
            font-family: 'Quicksand', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Floating background elements */
        #floating-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .heart {
            position: absolute;
            font-size: 1.5rem;
            animation: floatUp 8s linear infinite;
            opacity: 0.6;
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0.5) rotate(0deg); opacity: 0; }
            20% { opacity: 0.8; }
            80% { opacity: 0.6; }
            100% { transform: translateY(-10vh) scale(1.2) rotate(360deg); opacity: 0; }
        }

        /* Main Content Container */
        .container {
            position: relative;
            z-index: 1;
            width: 90%;
            max-width: 800px;
            margin: 50px auto;
            text-align: center;
        }

        header h1 {
            font-family: 'Pacifico', cursive;
            font-size: 4rem;
            color: var(--kuromi-pink);
            text-shadow: 2px 2px 8px rgba(255, 102, 178, 0.5);
            margin-bottom: 10px;
        }

        header p {
            font-size: 1.2rem;
            color: var(--baku-purple);
            font-weight: 600;
            letter-spacing: 1px;
        }

        /* The Card where you will put your content */
        .content-card {
            background-color: var(--card-bg);
            border: 2px solid var(--baku-purple);
            border-radius: 20px;
            padding: 40px;
            margin-top: 30px;
            box-shadow: 0 0 20px rgba(155, 89, 182, 0.4), inset 0 0 10px rgba(0,0,0,0.5);
            backdrop-filter: blur(5px);
            transition: transform 0.3s ease;
        }

        .content-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 0 30px rgba(255, 102, 178, 0.5);
        }

        .content-card h2 {
            font-family: 'Pacifico', cursive;
            color: var(--text-light);
            font-size: 2.5rem;
            margin-top: 0;
        }

        .placeholder-text {
            border: 2px dashed #555;
            padding: 30px;
            border-radius: 10px;
            color: #aaa;
            font-style: italic;
            margin: 20px 0;
        }

        /* Interactive Button */
        .interactive-btn {
            background: linear-gradient(45deg, var(--kuromi-pink), var(--baku-purple));
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.2rem;
            font-family: 'Quicksand', sans-serif;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
            margin-top: 20px;
        }

        .interactive-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 25px rgba(255, 102, 178, 0.6);
        }

        .interactive-btn:active {
            transform: scale(0.95);
        }

        /* Hidden Message */
        #secret-message {
            display: none;
            margin-top: 20px;
            font-size: 1.5rem;
            color: var(--kuromi-pink);
            font-weight: bold;
            animation: fadeIn 1s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Images placeholder styling */
        .character-art {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }

        .char-placeholder {
            width: 120px;
            height: 120px;
            background-color: rgba(255,255,255,0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--kuromi-pink);
            font-size: 0.9rem;
        }

        footer {
            margin-top: auto;
            padding: 20px;
            text-align: center;
            color: #888;
        }

    </style>
</head>
<body>

    <div id="floating-container"></div>

    <div class="container">
        <header>
            <h1>Happy Anniversary!</h1>
            <p>🖤 Mischief, Magic, and You 💜</p>
        </header>

        <main>
            <div class="content-card">
                <h2>Our Story</h2>
                
                <div class="placeholder-text">
                    [ Your custom photos, letters, memories, and timeline will be inserted right here! ]
                </div>

                <button class="interactive-btn" onclick="revealMessage()">Click for a Surprise!</button>
                <div id="secret-message">
                    I love you more than Kuromi loves her diary! 🖤✨
                </div>

                <div class="character-art">
                    <div class="char-placeholder" style="border-color: var(--kuromi-pink);">[Kuromi Image]</div>
                    <div class="char-placeholder" style="border-color: var(--baku-purple);">[Baku Image]</div>
                </div>
            </div>
        </main>
    </div>

    <footer>
        <p>Created with love & a little bit of Kuromi attitude.</p>
    </footer>

    <script>
        // Interactive Script 1: Reveal the hidden anniversary message
        function revealMessage() {
            const msg = document.getElementById('secret-message');
            const btn = document.querySelector('.interactive-btn');
            
            if (msg.style.display === 'none' || msg.style.display === '') {
                msg.style.display = 'block';
                btn.textContent = 'Hide Message';
                createBurst(); // Trigger a burst of hearts
            } else {
                msg.style.display = 'none';
                btn.textContent = 'Click for a Surprise!';
            }
        }

        // Interactive Script 2: Generate floating background elements (Skulls & Hearts)
        function createFloatingElements() {
            const container = document.getElementById('floating-container');
            const elements = ['🖤', '💜', '💀', '✨', '🎀']; // Kuromi themed emojis
            
            setInterval(() => {
                const el = document.createElement('div');
                el.classList.add('heart');
                el.innerText = elements[Math.floor(Math.random() * elements.length)];
                
                // Randomize position and animation duration
                el.style.left = Math.random() * 100 + 'vw';
                el.style.animationDuration = (Math.random() * 5 + 5) + 's';
                el.style.fontSize = (Math.random() * 1.5 + 1) + 'rem';
                
                container.appendChild(el);
                
                // Remove element after animation finishes to keep the page running smoothly
                setTimeout(() => {
                    el.remove();
                }, 10000);
            }, 800);
        }

        // Interactive Script 3: Create a burst of elements when the button is clicked
        function createBurst() {
            const container = document.getElementById('floating-container');
            for(let i = 0; i < 20; i++) {
                setTimeout(() => {
                    const el = document.createElement('div');
                    el.classList.add('heart');
                    el.innerText = '💖';
                    el.style.left = Math.random() * 100 + 'vw';
                    el.style.animationDuration = (Math.random() * 3 + 2) + 's';
                    container.appendChild(el);
                    setTimeout(() => el.remove(), 5000);
                }, i * 50);
            }
        }

        // Start the background animation when the page loads
        window.onload = createFloatingElements;
    </script>

</body>
</html>
